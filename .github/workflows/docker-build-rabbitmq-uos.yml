name: RabbitMQ 镜像构建 (UOS / kylin)
# 适用仓库结构: <版本>/<变体>/Dockerfile
#   变体 = UOS   -> 基础镜像 UOS Server 20 1070a，产物 tag: <版本目录>-management
#   变体 = kylin -> 基础镜像 Kylin Server V11 Minimal，产物 tag: <版本目录>-kylin-management
#   （alpine / ubuntu 为上游模板生成，不参与本 workflow）
#
# 功能:
#   1. detect    : 自动检测本次提交涉及的 <版本>/<变体> 目录 (如 4.3/UOS、4.4/kylin)
#   2. build-push: push 到 master 或手动触发时，推送镜像到 ghcr.io
#   3. 上游监听  : 定时 (schedule) 或手动 (check_upstream=true) 检查
#      https://github.com/rabbitmq/rabbitmq-server/releases 官方发布的最新
#      <版本目录>.x 正式版本 (排除 draft/prerelease/rc)，发现新版本时:
#        a) 自动更新每个变体 <版本>/<变体>/Dockerfile 中的 ARG RABBITMQ_VERSION 并提交回 master
#        b) 同一次 run 内立即用新版本号构建镜像 (tar.xz 的 .asc PGP 签名校验
#           随版本号自动适配，无需人工介入)
#
# 变体列表由目录结构自动推导（<版本>/<目录>/Dockerfile，排除 alpine/ubuntu），
# 新增变体目录后无需修改本文件。
on:
  push:
    branches: [master]
    paths:
      - "*/UOS/**"
      - "*/kylin/**"
      - ".github/workflows/docker-build-rabbitmq-uos.yml"
  pull_request:
    branches: [master]
    paths:
      - "*/UOS/**"
      - "*/kylin/**"
      - ".github/workflows/docker-build-rabbitmq-uos.yml"
  schedule:
    # 每日 UTC 02:00 (北京时间 10:00) 检查上游 rabbitmq-server 最新正式版
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      version_dir:
        description: "要构建的版本目录名 (如 4.3; 留空则构建全部)"
        required: false
        default: ""
      variant:
        description: "要构建的变体 (UOS / kylin; 留空则构建全部变体)"
        required: false
        default: ""
      check_upstream:
        description: "检查上游 rabbitmq-server 最新正式版 (有新版则自动升级构建)"
        required: false
        default: false
        type: boolean
env:
  REGISTRY: ghcr.io
  # 构建平台; 如需 arm64 改为 "linux/amd64,linux/arm64"
  # (前提: 对应基础镜像已推送 arm64 架构: UOS 的 uos-server-20-1070a / Kylin 的 kylin-server-minimal)
  PLATFORMS: linux/amd64
concurrency:
  group: rabbitmq-images-${{ github.ref }}
  cancel-in-progress: true
# GITHUB_TOKEN 默认只读; detect 需写权限提交版本升级 commit，
# build-push 需 packages:write 推送镜像
permissions:
  contents: read
jobs:
  ############################################
  # 检测待构建版本 (两种模式):
  #   diff     : push/pull_request/手动 - 由本次提交涉及的文件变更决定
  #   upstream : schedule/手动(check_upstream) - 由上游官方最新正式版决定，
  #              有新版本时同步更新各变体 Dockerfile 并提交回 master
  # 输出 matrix: [{version: "4.3", variant: "UOS", rabbitmq_version: "4.3.7"}, ...]
  # 无待构建项时输出 []
  ############################################
  detect:
    name: 检测待构建版本
    runs-on: ubuntu-latest
    permissions:
      # 上游模式需要提交 ARG RABBITMQ_VERSION 升级 commit 到 master
      # (GITHUB_TOKEN 的 push 不会触发新的 workflow run，不会造成重复构建)
      contents: write
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 计算待构建版本矩阵
        id: set
        run: |
          set -eux
          mode="diff"
          case "${{ github.event_name }}" in
            schedule) mode="upstream" ;;
            workflow_dispatch)
              if [ "${{ inputs.check_upstream }}" = "true" ]; then
                mode="upstream"
              fi
              ;;
          esac
          echo "mode=${mode}" >> "$GITHUB_STEP_SUMMARY" || true

          # 变体列表: 由目录结构推导 <版本>/<变体>/Dockerfile，排除上游模板生成的 alpine/ubuntu
          variants="$(find . -mindepth 3 -maxdepth 3 -name Dockerfile -path './*/*/Dockerfile' \
            | awk -F/ '{print $3}' | sort -u | grep -Ev '^(alpine|ubuntu)$' || true)"
          if [ -z "$variants" ]; then
            echo "::error::未找到任何变体目录 (<版本>/<变体>/Dockerfile)"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "变体: $(echo $variants)"

          matrix_entries_arr=()
          should_commit="no"
          if [ "$mode" = "upstream" ]; then
            ########################################
            # 上游监听模式
            # 仅取与版本目录 (如 4.3) 匹配的正式版 tag: v4.3.N
            # 排除 draft / prerelease (rc/alpha/beta 均为 prerelease)
            ########################################
            RELEASES=$(curl --max-time 30 --retry 3 -fsSL -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/rabbitmq/rabbitmq-server/releases?page=1&per_page=100')

            while IFS= read -r dockerfile; do
              vdir="$(dirname "$(dirname "$dockerfile")")"          # 4.3/UOS -> 4.3
              variant="$(basename "$(dirname "$dockerfile")")"      # 4.3/UOS -> UOS
              # 精准提取 ARG RABBITMQ_VERSION，忽略注释、行尾空格与 CRLF
              current="$(sed -nE 's/^ARG[[:space:]]+RABBITMQ_VERSION=([^ #]+).*/\1/p' "$dockerfile" | tr -d '\r' | head -n1)"
              test -n "$current" || { echo "::warning::${dockerfile} 未找到 ARG RABBITMQ_VERSION，跳过"; continue; }

              # 过滤非 draft / 非 prerelease，tag 形如 v4.3.7，取语义化版本最大者
              latest=$(echo "$RELEASES" | jq -r --arg vdir "$vdir" '
                [
                  .[]
                  | select(.draft == false and .prerelease == false)
                  | .tag_name
                  | select( test("^v\($vdir)\\.[0-9]+$") )
                  | sub("^v"; "")
                ]
                | sort_by( split(".") | map(tonumber) )
                | last // empty
              ')

              if [ -z "$latest" ]; then
                echo "::notice::${vdir}/${variant}: 上游未发现匹配 v${vdir}.x 的正式版，跳过"
                continue
              fi
              if [ "$latest" != "$current" ]; then
                echo "::notice::${vdir}/${variant}: 上游有新版本 ${current} -> ${latest}"
                # 精准替换 ARG 行，保留原有行格式，只替换版本号
                sed -i -E "s/^(ARG[[:space:]]+RABBITMQ_VERSION=).*/\1${latest}/" "$dockerfile"
                matrix_entries_arr+=("{\"version\":\"${vdir}\",\"variant\":\"${variant}\",\"rabbitmq_version\":\"${latest}\"}")
                should_commit="yes"
              else
                echo "::notice::${vdir}/${variant}: 已是上游最新正式版 ${current}，无需构建"
              fi
            done < <(find . -mindepth 3 -maxdepth 3 -name Dockerfile -path './*/*/Dockerfile' \
                       | grep -Ev '/(alpine|ubuntu)/' | sed 's|^\./||' | sort)
          else
            ########################################
            # 变更检测模式: 由本次提交涉及的文件决定
            ########################################
            files=""
            case "${{ github.event_name }}" in
              pull_request)
                git fetch origin "${{ github.base_ref }}"
                files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
                ;;
              push)
                files=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
                ;;
            esac
            # 取不到 diff (手动触发 / 新建分支首推 / 重跑) 时的兜底:
            #   指定了 version_dir -> 只构建该版本 (可再指定 variant); 否则构建全部变体
            if [ -z "$files" ] && [ -n "${{ github.event.inputs.version_dir }}" ]; then
              vd="${{ github.event.inputs.version_dir }}"
              vi="${{ github.event.inputs.variant }}"
              if [ -n "$vi" ]; then
                files="${vd}/${vi}/Dockerfile"
              else
                for var in $variants; do
                  files="${files}${vd}/${var}/Dockerfile"$'\n'
                done
              fi
            fi
            if [ -z "$files" ]; then
              files=$(find . -mindepth 3 -maxdepth 3 -name Dockerfile -path './*/*/Dockerfile' \
                | grep -Ev '/(alpine|ubuntu)/' | sed 's|^\./||')
            fi
            # 解析出 (版本, 变体) 组合，过滤掉 .github 等非版本目录
            pairs=$(printf '%s\n' "$files" | awk -F/ 'NF>=3 {print $1"/"$2}' | sort -u \
              | grep -E '^[0-9]+(\.[0-9]+)*/[^/]+$' || true)
            while IFS=/ read -r v var; do
              [ -n "${v:-}" ] || continue
              case "${var:-}" in alpine|ubuntu) continue ;; esac
              # 仅保留实际存在的目录，防止 workflow_dispatch 手输错
              [ -f "${v}/${var}/Dockerfile" ] || continue
              cur="$(sed -nE 's/^ARG[[:space:]]+RABBITMQ_VERSION=([^ #]+).*/\1/p' "${v}/${var}/Dockerfile" | tr -d '\r' | head -n1)"
              test -n "$cur" || { echo "::warning::${v}/${var}/Dockerfile 缺少 RABBITMQ_VERSION"; continue; }
              matrix_entries_arr+=("{\"version\":\"${v}\",\"variant\":\"${var}\",\"rabbitmq_version\":\"${cur}\"}")
            done < <(printf '%s\n' "$pairs")
          fi

          # 生成最终矩阵
          matrix="[$(IFS=,; echo "${matrix_entries_arr[*]}")]"
          # 提交 Dockerfile 版本升级，保持仓库与上游同步 (仅上游模式)
          if [ "$mode" = "upstream" ] && [ "$should_commit" = "yes" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            if git diff --cached --quiet; then
              echo "::warning::版本号已更新但没有可提交的变更"
            else
              git commit -m "chore(bump): RABBITMQ_VERSION 升级为上游最新正式版 (由定时任务自动检测)"
              if git push; then
                echo "已提交版本升级 commit 到 master"
              else
                # 推送失败不阻断构建: 本次 run 仍会用新版本号构建镜像
                echo "::warning::版本升级 commit 推送失败 (可能因分支保护)，本次构建继续使用检测到的新版本号"
              fi
            fi
          fi
          if [ "$matrix" = "[]" ]; then
            echo "::notice::没有需要构建的版本，跳过"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "待构建矩阵: ${matrix}" >> "$GITHUB_STEP_SUMMARY"
  ############################################
  # 构建并推送镜像 (push 到 master / 手动触发 / 定时检测到上游新版本)
  ############################################
  build-push:
    name: "推送镜像 (${{ matrix.version }}/${{ matrix.variant }})"
    needs: [detect]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule') &&
      needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # 同时最多 3 个构建作业: 每个作业都要从 github.com 拉 erlang RPM(~100MB) 与 RabbitMQ 发行包，
      # 10 个作业并行时高并发下载会被限流/连接重置（表现为 wget/curl 网络类失败），
      # 降低并发后成功率明显提升；配合 Dockerfile 内的 5 次退避重试兜底。
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      BUILD_DIR: ${{ matrix.version }}/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: 设置 QEMU (仅多架构时需要)
        if: contains(env.PLATFORMS, 'arm')
        uses: docker/setup-qemu-action@v3
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算镜像名称与 tag
        id: meta
        run: |
          set -eux
          VERSION_DIR="${{ matrix.version }}"
          VARIANT="${{ matrix.variant }}"
          # 完整版本号来自 detect 矩阵:
          #   - 变更模式  = Dockerfile 中的 ARG RABBITMQ_VERSION
          #   - 上游模式  = 官方 releases 检测到的最新正式版
          FULL_VERSION="${{ matrix.rabbitmq_version }}"
          test -n "$FULL_VERSION"
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${REPO}"
          # 镜像自带 rabbitmq_management 管理控制台，tag 统一带 -management 后缀;
          # UOS 保持既有命名 (无 OS 后缀)，其它变体追加 -<变体> 以区分
          SUFFIX=""
          if [ "$VARIANT" != "UOS" ]; then
            SUFFIX="-${VARIANT}"
          fi
          {
            echo "image=${IMAGE}"
            echo "tags=${IMAGE}:${VERSION_DIR}${SUFFIX}-management,${IMAGE}:${FULL_VERSION}${SUFFIX}-management"
          } >> "$GITHUB_OUTPUT"
      - name: 构建并推送
        id: build
        # 首次失败不立刻判死: 失败多为 GitHub 下载抖动，下面有一次完整重试
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_DIR }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          # RABBITMQ_VERSION 通过 build-arg 传入:
          #   - 上游模式下与已提交的 Dockerfile 值一致 (双保险)
          #   - erlang RPM 版本/SHA256/OTP 不随 RabbitMQ 补丁版本变化，无需更新
          build-args: |
            RABBITMQ_VERSION=${{ matrix.rabbitmq_version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=rabbitmq-${{ matrix.version }}-${{ matrix.variant }}
          cache-to: type=gha,scope=rabbitmq-${{ matrix.version }}-${{ matrix.variant }},mode=max
      - name: 重试构建并推送 (首次失败时)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_DIR }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            RABBITMQ_VERSION=${{ matrix.rabbitmq_version }}
          tags: ${{ steps.meta.outputs.tags }}
          # 复用首次已构建的层，只重跑失败的那一步及其之后
          cache-from: type=gha,scope=rabbitmq-${{ matrix.version }}-${{ matrix.variant }}
          cache-to: type=gha,scope=rabbitmq-${{ matrix.version }}-${{ matrix.variant }},mode=max
      - name: 汇总输出
        run: |
          {
            echo "### 已推送镜像 (${{ matrix.version }}/${{ matrix.variant }})"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
